# 把 Docusaurus 构建产物发布到 GitHub Pages
#
# 触发条件：main 分支有推送，或手动点击 Run workflow
# 产物路径：build/（npm run build 生成）
#
# 四语言会一次性全部构建：/ 、/zh-Hans/ 、/ja/ 、/de/

name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 这两个权限是 GitHub Pages 官方部署方式（OIDC）的硬性要求，缺一不可
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送排队而不是互相覆盖
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # showLastUpdateTime 需要读 git 历史，浅克隆会让最后更新时间不准
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与本地开发环境保持一致（Node 22）
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build all locales
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
